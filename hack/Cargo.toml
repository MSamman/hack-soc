[package]
name = "hack"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crc = "3.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serialport = "4.9.0"
